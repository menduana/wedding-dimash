<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дінмұхаммед & Айжан - Үйлену тойы</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f3f1ed;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
        }

        /* Контейнер со скролл-эффектом "прилипания" страниц */
        .story-container {
            width: 100%;
            max-width: 450px; /* Идеально для мобильных */
            height: 100vh;
            margin: 0 auto;
            overflow-y: scroll;
            scrollbar-width: none; /* Прячем скроллбар в Firefox */
        }

        .story-container::-webkit-scrollbar {
            display: none; /* Прячем скроллбар в Chrome/Safari */
        }

        /* Общие настройки для каждого экрана */
        .page-screen {
            position: relative;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* 1 ЭКРАН: Настройки фонового видео */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Красивое затемнение и заголовок поверх видео */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .video-overlay h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Форма опроса на последнем экране */
        .rsvp-form-container {
            position: absolute;
            top: 25%;
            margin: 30px auto 50px auto;
            width: 85%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #c8b195;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            z-index: 5;
        }

        .radio-btn label {
            padding: 12px !important;
            font-size: 1.1rem !important;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #c8b195;
            background: white;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1.1rem;
            color: #4a3e3d;
            text-align: center;
            margin-top: 5px;
        }

        .radio-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .radio-btn {
            flex: 1;
            position: relative;
        }

        .radio-btn input[type="radio"] {
            display: none;
        }

        .radio-btn label {
            display: block;
            background: white;
            border: 1px solid #c8b195;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .radio-btn input[type="radio"]:checked + label {
            background-color: #5c4e41;
            color: white;
            border-color: #5c4e41;
        }

        button.submit-btn {
            width: 100%;
            background-color: #5c4e41;
            color: white;
            border: none;
            padding: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        #statusMessage {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Стильный благородный разделитель между экранами */
        .wedding-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 2px;
            background-color: #c8b195;
            position: relative;
            margin: 0;
            z-index: 10;
        }

        .wedding-divider span {
            color: #9a8470;
            font-size: 1.6rem;     
            position: absolute;
            z-index: 11;
            background: transparent; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            line-height: 0;
            display: inline-block;
            text-shadow: 0 0 6px #f3f1ed, 0 0 6px #f3f1ed, 
                         0 0 6px #f3f1ed, 0 0 6px #f3f1ed;
        }

        /* Кнопка 2ГИС на третьем экране */
        .maps-btn-container {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 80%;
            text-align: center;
        }

        .dg-btn {
            display: inline-block;
            width: 100%;
            max-width: 280px;
            background-color: #5c4e41;
            color: white !important;
            text-decoration: none;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 1px solid #c8b195;
        }

        .dg-btn:active {
            transform: scale(0.98);
            background-color: #4a3e3d;
        }
.music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #c8b195;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 999; /* Поверх всех экранов */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        /* Анимация вращения, когда музыка играет */
        .music-btn.playing {
            animation: spin 4s linear infinite;
            background: #5c4e41;
            color: white;
            border-color: #5c4e41;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Стили для обратного таймера */
        .countdown-container {
            text-align: center;
            position: absolute;
            top: 78%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            z-index: 5;
        }

        .countdown-title {
            font-size: 1.4rem;
            color: #4a3e3d;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .timer-item {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(5px);
            border: 1px solid #c8b195;
            border-radius: 8px;
            padding: 8px;
            min-width: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .timer-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #5c4e41;
            display: block;
            line-height: 1.2;
        }

        .timer-label {
            font-size: 0.75rem;
            color: #9a8470;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
<button class="music-btn" id="musicToggle">♫</button>
    
    <audio id="bgMusic" src="music.mp3" loop></audio>
    <div class="story-container">

        <div class="page-screen">
            <div class="video-wrapper">
                <video class="video-bg" autoplay muted loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-overlay">
                <h1></h1>
            </div>
        </div>

        <div class="wedding-divider"><span>✦</span></div>

        <div class="page-screen" style="background-image: url('photo1.png');"></div>

        <div class="wedding-divider"><span>✦</span></div>

        <div class="page-screen" style="background-image: url('photo2.png');"></div>

        <div class="wedding-divider"><span>✦</span></div>

        <div class="page-screen" style="background-image: url('photo3.png');">
            <div class="maps-btn-container">
                <a href="https://2gis.kz/atyrau/search/%D0%9F%D1%80%D0%BE%D0%B5%D0%B7%D0%B4%20%D0%96%D0%B0%D0%BD%D0%B3%D0%B8%D1%80%20%D1%85%D0%B0%D0%BD%2C%201%D0%B0%2F1%20Zazyna%20Ballroom/firm/70000001080631611/51.9345%2C47.109487?m=51.93439%2C47.111478%2F11.84" target="_blank" class="dg-btn">
                    Картадан көру
                </a>
            </div>
        </div>

        <div class="wedding-divider"><span>✦</span></div>

        <div class="page-screen" style="background-image: url('photo4.png');">
            
            <div class="countdown-container">
                <div class="countdown-title">Тойға дейін қалды:</div>
                <div class="countdown-timer">
                    <div class="timer-item">
                        <span class="timer-number" id="days">00</span>
                        <span class="timer-label">күн</span>
                    </div>
                    <div class="timer-item">
                        <span class="timer-number" id="hours">00</span>
                        <span class="timer-label">сағат</span>
                    </div>
                    <div class="timer-item">
                        <span class="timer-number" id="minutes">00</span>
                        <span class="timer-label">минут</span>
                    </div>
                    <div class="timer-item">
                        <span class="timer-number" id="seconds">00</span>
                        <span class="timer-label">сек</span>
                    </div>
                </div>
            </div>

            <div class="rsvp-form-container">
                <form id="telegramForm">
                    <div class="form-group">
                        <input type="text" id="guestName" placeholder="Аты-жөніңізді жазыңыз" required>
                    </div>

                    <div class="radio-options"> 
                        <div class="radio-btn">
                            <input type="radio" id="option1" name="attendance" value="Келемін" required>
                            <label for="option1">Келемін</label>
                        </div>
                        
                        <div class="radio-btn">
                            <input type="radio" id="option2" name="attendance" value="Жұбайыммен келемін">
                            <label for="option2">Жұбайыммен келемін</label>
                        </div>

                        <div class="radio-btn">
                            <input type="radio" id="option3" name="attendance" value="Өкінішке орай, келе алмаймын">
                            <label for="option3">Келе алмаймын</label>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Жауапты жіберу</button>
                </form>
                <p id="statusMessage"></p>
            </div>

        </div>

    </div>

    <script>
        // Укажите ваши данные от Telegram ниже:
        const TELEGRAM_BOT_TOKEN = '8882229427:AAEOyE8yplr9C9QPyHOwyCm-Ad2F__AURuA';
        const TELEGRAM_CHAT_ID = '8075008664';
const musicBtn = document.getElementById('musicToggle');
        const audio = document.getElementById('bgMusic');

        musicBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                musicBtn.classList.add('playing');
                musicBtn.textContent = '♫'; // Иконка паузы при проигрывании
            } else {
                audio.pause();
                musicBtn.classList.remove('playing');
                musicBtn.textContent = '♫';
                musicBtn.style.color = '#5c4e41';
            }
        });

        // Попытка включить музыку автоматически при первой активности пользователя (требование современных браузеров)
        document.addEventListener('click', () => {
            // Если музыка еще не играет и кнопка не в режиме паузы, можно запустить
            // Но лучше оставить выбор за гостем через кнопку
        }, { once: true });
        // 1. ОБРАБОТЧИК ФОРМЫ ТЕЛЕГРАМ
        document.getElementById('telegramForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('guestName').value;
            const attendance = document.querySelector('input[name="attendance"]:checked').value;
            const statusMessage = document.getElementById('statusMessage');

            let attendanceStatus = '';
            if (attendance === 'Келемін') {
                attendanceStatus = '✅ Келеді!';
            } else if (attendance === 'Жұбайыммен келемін') {
                attendanceStatus = '❤️ Жұбайымен келеді!';
            } else {
                attendanceStatus = '❌ Келе алмайды';
            }

            const text = `🔔 *Тойға жаңа жауап!*\n\n👤 *Қонақ:* ${name}\n❓ *Жауап:* ${attendanceStatus}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => {
                if (response.ok) {
                    statusMessage.style.color = '#5c4e41';
                    statusMessage.textContent = 'Рахмет! Жауабыңыз қабылданды.';
                    document.getElementById('telegramForm').reset();
                } else {
                    statusMessage.style.color = 'red';
                    statusMessage.textContent = 'Қате кетті. Қайтадан байқап көріңіз.';
                }
            })
            .catch(error => {
                statusMessage.style.color = 'red';
                statusMessage.textContent = 'Желіде қате бар.';
                console.error(error);
            });
        });

        // 2. НАСТРОЙКА ДАТЫ СВАДЬБЫ: 15 августа 2026 года, 20:00
        const weddingDate = new Date(2026, 7, 15, 20, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = weddingDate - now;

            if (timeLeft < 0) {
                document.querySelector('.countdown-container').innerHTML = "<div class='countdown-title'>Үйлену тойы басталды! 🎉</div>";
                clearInterval(timerInterval);
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days < 10 ? '0' + days : days;
            document.getElementById('hours').textContent = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').textContent = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').textContent = seconds < 10 ? '0' + seconds : seconds;
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
